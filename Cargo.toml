[workspace]
resolver = "2"
members = [
    "crates/org-members",
    "crates/org-io",
    "crates/org-node",
    "crates/person",
    "crates/sparse-merkle-tree",
    "spikes/common",
    "spikes/keyhive",
    "spikes/p2panda",
]
# crates/on-chain-client declares its own [workspace] and is intentionally outside
# this workspace. It is used as a path dependency by org-io. Excluding it
# here prevents the "multiple workspace roots" error when Cargo traverses the
# directory tree.
exclude = [
    "crates/on-chain-client",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# An ignored `StoreWrite` or `StoreChange` (both `#[must_use]`) is a store
# change org-io never wrote: a compile error in every crate inheriting these
# lints (S4, task T3 of docs/plans/2026-10-06-org-io-transport.md).
[workspace.lints.rust]
unused_must_use = "deny"
