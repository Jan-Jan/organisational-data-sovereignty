# guardrails configuration for the `on-chain-client` unit — flat schema only:
#   `key: value` scalars and two-space `- item` lists, every key at column one,
#   set once, in its own form (LIST keys: strict_paths, test_paths,
#   verify_commands, coverage_command, depends_on, segregated_from; everything
#   else a scalar). The schema is CLOSED and validated before any gate runs;
#   the full rule list, with the reason each rule exists, is the header of
#   templates/config.yaml in the guardrails repository this was copied from.
#
# This is a UNIT config (.guardrails/units.yaml at the repository root names
# the units). Every doc_* value and every strict_paths/test_paths entry must
# sit inside this unit's own directory, and doc_verification must NOT be set —
# the verification record is repository-level (docs/verification).
#
# Scripts run from the repository root, so paths and commands below are
# repository-relative.
guardrails_version: 0.5.1
guardrails_commit: e2eac86ff8db2157735b9604b7ade190d4f465f3

# IEC 62304 software safety class. C: this crate decides what the chain says
# the membership is (decoding org state and revive events); a wrong or stale
# reading feeds every consumer's access decision. See
# docs/adr/2026-09-05-units-and-per-unit-classes.md.
safety_class: C

id_prefixes: REQ HAZ RC SDD LLR PR

# Canonical document locations. README-only ledgers as of 2026-09-05: this
# unit has no items yet. The hazards touching it (two mentions) are still in
# org-members' RMF and move here at the hazard-redistribution tooth.
doc_srs: on-chain-client/docs/requirements
doc_rmf: on-chain-client/docs/risk
doc_sad: on-chain-client/docs/architecture
doc_soup: on-chain-client/docs/architecture/soup.md
doc_problems: on-chain-client/docs/problems

strict_paths:
  - on-chain-client/src

test_paths:
  - on-chain-client/tests

# --lib drops the nine ungated integration targets; the three libfuzzer targets
# are named back in explicitly so that restriction does not silently drop them
# (project rule: always include fuzz testing).
#
# CORRECTED 2026-09-28 by the review sweep of the change
# `worktree-guardrails-on-chain-client-arch`: this comment said all nine "need
# on-chain/scripts/node_modules", which is false for two of them. Seven need a
# chopsticks fork and those node_modules; `smoldot_smoke` is
# `#[ignore]`d and needs live Paseo instead; `regenerate_corpus` is an
# `#[ignore]`d corpus writer that needs no chain at all. Nine is still the right
# count of targets `--lib` drops.
#
# `--features test-support` and the nine annotated targets after the fuzz ones
# were added 2026-09-10 by docs/plans/2026-09-10-on-chain-client-risk-analysis.md
# (the ninth, `type_widths`, by review round 1's finding 1):
# they are where this unit's risk controls are verified, and each is declared in
# on-chain-client/Cargo.toml with `required-features = ["test-support"]` so that
# naming one here without the feature is a cargo ERROR, not a silent skip. The
# order matches the Cargo.toml declarations and the `coverage-on-chain-client`
# recipe in the Makefile.
verify_commands:
  - cargo test --manifest-path on-chain-client/Cargo.toml --features test-support --lib --test fuzz_decode_org_state --test fuzz_parse_revive_event --test fuzz_event_round_trip --test contract_address_filter --test log_ownership --test decode_revive_event --test decode_org_state --test runtime_version_dispatch --test h160_mapping --test storage_slot_layout --test best_lane_reorg_rule --test type_widths

problem_age_days: 30
problem_open_max: 10

# Structural coverage against the class C target. `make coverage-on-chain-client`
# enforces line and region floors (Makefile; measured 2026-08-26: 53.57% lines
# / 59.19% regions). That floor is an accepted SHORTFALL, not a target met:
# client.rs is exercised almost entirely by the integration tests outside
# verify_commands. Decision coverage is unmeasured. Both gaps are tracked in
# docs/plans/2026-09-05-ratchet-setup.md.
#
# RECALIBRATED 2026-09-10 — the paragraph above describes the OLD measurement
# basis and is kept for the history; the floors it names (52 / 58) no longer
# exist. Re-measured after the eight annotated targets joined both
# verify_commands above and the `coverage-on-chain-client` recipe: 42.91% lines
# / 43.47% regions, and the floors are now 41 / 42, one point below — this
# command exits 0.
#
# RE-MEASURED AGAIN after review round 1's finding 1 added the ninth target,
# `type_widths`: 41.75% lines / 42.45% regions over 491 lines, and this command
# still exits 0. The floors are NOT moved for it — the same ten fully-covered
# library lines that left `src/types.rs` left the denominator with them
# (types.rs 13 -> 3 lines, covered 215 of 501 -> 205 of 491), so the headline
# fell about a point while both tests carried on running. The full arithmetic
# is in the Makefile beside the floors.
#
# The headline fell while real coverage rose, which is why the floors moved and
# why that is not a lowering. T3-T7 relocated twenty-three tests out of
# `#[cfg(test)]` modules in on-chain-client/src into on-chain-client/tests,
# which is where this unit's test_paths points and therefore the only place
# `check-trace.sh` can read a `verifies:` annotation at all. That removed 214
# executed test-body lines which llvm-cov had been counting as 100%-covered
# LIBRARY lines, inflating both sides of the old ratio. Netting them out, real
# covered library lines rose from ~169 to 215. Measured on the same tree the OLD
# recipe reads 23.75% / 24.08%, so the eight targets recover nineteen of the
# thirty points the relocation cost.
#
# Per file, 2026-09-10: decode/v_paseo_ah.rs 100.00% (was 96.23%), h160.rs
# 100.00%, types.rs 100.00%, decode/dispatch.rs 100.00%, decode/mod.rs 64.29%
# (was 0.00%), client.rs 16.37% over 336 of the 501 lines (of 491 after
# `type_widths`; only types.rs's own line count changed, from 13 to 3, and it
# is still 100.00%). The aggregate is dragged down by client.rs alone — two
# thirds of the crate — and client.rs is the async subxt code the FIVE
# chopsticks targets that construct an `OrgRegistryClient` exercise, targets no
# gate runs (CORRECTED 2026-09-28 by the review sweep of the change
# `worktree-guardrails-on-chain-client-arch`: this said nine, which is the count
# of ungated targets, not the count that reach client.rs. The five are
# off_chain_genesis_ceremony, p_address_is_orgid, reorg_cancels_proposed,
# scenario_a_full and two_orgs_one_watcher; 00_chopsticks_sanity and
# 01_multisig_sanity import nothing from the crate, smoldot_smoke touches only
# decode::dispatch::for_runtime, and regenerate_corpus constructs no client).
# That SHORTFALL is unchanged since 2026-08-26 and is still a shortfall, not a
# target met. Decision coverage remains unmeasured in every unit. Both gaps stay tracked in
# docs/plans/2026-09-05-ratchet-setup.md. The recalibration is the owner's
# explicit decision; its reasoning is set out in full in the Makefile beside
# the floors themselves, and is carried into this change's verification record,
# docs/verification/2026-09-10-worktree-guardrails-on-chain-client-risk.md,
# which is written at merge-change step 6b — after review, so it does not exist
# while this line is being read on the change branch.
coverage_command:
  - make coverage-on-chain-client

expectation_age_days: 90
expectation_open_max: 10

