# Rust + guardrails CI.
#
# Multi-unit repository since 2026-09-05 (.guardrails/units.yaml): each unit's
# `verify_commands` live in `<unit>/.guardrails/config.yaml`. The `test` job
# runs the cargo entries of org-members, on-chain-client, org-node and person
# verbatim, so that CI and the local merge gate cannot disagree about what
# "passing" means; person's clippy entry runs verbatim in the `clippy` job
# (since 2026-10-05). The app unit has THREE verify_commands as of 2026-09-14,
# and TWO of them run here, in the `app-frontend` job below:
# `npm --prefix app run check` and `npm --prefix app run test`, each preceded
# by the `npm --prefix app ci` they need because app/node_modules is
# gitignored.
#
# The THIRD — the cargo entry, `cargo test --manifest-path
# app/src-tauri/Cargo.toml --features test-support --test …` over six targets —
# still runs NOWHERE in CI: it needs Tauri's Linux system packages
# (webkit2gtk, libsoup, …) this workflow does not install, so for that entry
# the merge gate remains the only gate. That remaining gap is recorded in
# docs/plans/2026-09-05-ratchet-setup.md. `clippy` and `no-std` are
# additional contracts that exist only here — see the note on each about why,
# and about the cost of that.
#
# The quint models and the Apalache bounded verify live in quint.yml.
name: rust

on: [push, pull_request]

jobs:
  # The cargo test entries of org-members', on-chain-client's, org-node's and
  # person's verify_commands. The quint typecheck entries are covered by the `quint`
  # job in quint.yml.
  #
  # quint is installed because `cargo test -p org-members` includes the
  # `mbt_conformance` target, which shells out to it. That test does NOT skip
  # when quint is absent: its preflight names the cause and the test fails
  # (docs/adr/2026-10-03-quint-conformance-gate.md, decision 9). So a job that
  # ran this entry without quint would be red on every push.
  #
  # quint.yml's duplicate `mbt` job was removed on 2026-10-03; this job is
  # the only CI run of the conformance test.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i -g @informalsystems/quint
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p org-members
      # on-chain-client's verify_commands entry. `--features test-support` and
      # the nine annotated targets after the fuzz ones are where this unit's
      # risk controls are verified; each is declared with
      # `required-features = ["test-support"]`, so naming one without the
      # feature is a cargo error rather than a silent skip. The `clippy` job
      # below stays on `--lib`, which does not compile `test-support`, so this
      # exposure cannot regress the panic-freedom gate.
      - run: |
          cargo test --manifest-path on-chain-client/Cargo.toml --features test-support --lib \
            --test fuzz_decode_org_state \
            --test fuzz_parse_revive_event \
            --test fuzz_event_round_trip \
            --test contract_address_filter \
            --test log_ownership \
            --test decode_revive_event \
            --test decode_org_state \
            --test runtime_version_dispatch \
            --test h160_mapping \
            --test storage_slot_layout \
            --test best_lane_reorg_rule \
            --test type_widths
      # org-node's verify_commands entry. The chopsticks-dependent targets are
      # excluded there too, and the feature flags are required by the targets'
      # `required-features`.
      - run: |
          cargo test -p org-node --features app,test-support --lib \
            --test service_stories --test transport_handshake --test transport_networked \
            --test fuzz_envelope_decode --test fuzz_verify_against_chain \
            --test verify_against_chain --test wire_frame_bound --test store_at_rest \
            --test admission_sender
      # person's verify_commands test entry: every target, none excluded.
      - run: cargo test -p person

  # The declared MSRV, measured (docs/adr/2026-10-03-quint-conformance-gate.md,
  # decision 6): quint-connect is edition 2024, so the test build needs 1.85.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i -g @informalsystems/quint
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo test -p org-members
      # person declares the same rust-version.
      - run: cargo test -p person

  # app's npm verify_commands. The cargo entry still runs NOWHERE in CI: it
  # needs Tauri's Linux system packages (webkit2gtk, libsoup, …) this workflow
  # does not install, so for that entry the merge gate remains the only gate.
  # Recorded in docs/plans/2026-09-05-ratchet-setup.md.
  #
  # `npm ci` installs from app/package-lock.json and IGNORES app/package.json,
  # so the lock must carry vitest — measured 2026-09-14: against the lock as
  # it stood before this change, `npm --prefix app ci` itself failed with
  # "Missing: vitest@5.0.0 from lock file", before any test could run.
  app-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm --prefix app ci
      - run: npm --prefix app run check
      - run: npm --prefix app run test

  # Lib targets only for org-members and on-chain-client (person, the last
  # step, is --all-targets). Two separate reasons, and only the first is
  # principled:
  #
  # 1. on-chain-client's test code is ALLOWED to panic. Measured today,
  #    `--all-targets -- -D warnings` reports 144 lint errors across 13 test
  #    targets: 123 `expect()` on Result, 18 on Option, and 3 `panic`. The
  #    project's rule (org-members/AGENTS.md) is "no exceptions in lib code;
  #    unwrap() is fine in tests", so those are not defects.
  # 2. org-members' test code also fails --all-targets, but on ONE ordinary
  #    lint that has nothing to do with that rule: `manual_contains` in
  #    tests/fuzz_tests.rs. `--lib` suppresses it too. That is a concession,
  #    not a principle, and it should be fixed and the scope widened.
  #
  # Where the deny rules come from, since it is easy to assume wrongly:
  # org-members has NO [lints] section and does not inherit the workspace
  # lints — it denies via #![deny(...)] in src/lib.rs. on-chain-client has its
  # own [lints.clippy]. The root [workspace.lints.clippy] reaches only crates
  # that opt in with `[lints] workspace = true`.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy -p org-members --lib -- -D warnings
      - run: cargo clippy --manifest-path on-chain-client/Cargo.toml --lib -- -D warnings
      # person's verify_commands clippy entry, verbatim. Unlike the two above it
      # covers --all-targets: person inherits the workspace lints, and its test
      # targets allow `expect` by an explicit attribute where they use it.
      - run: cargo clippy -p person --all-targets -- -D warnings

  # org-members' documented build matrix (org-members/AGENTS.md), and person's
  # wasm32 checks. no_std is a hard requirement for both, but
  # wasm32-unknown-unknown has std, so a wasm32 check proves only that a crate
  # builds for that target, not that it is no_std. For person the no_std proof
  # is `#![no_std]` in person/src/lib.rs, which the crate-discipline test
  # checks. Compile-check only — it does not prove a crate RUNS under wasm32.
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo check -p org-members --no-default-features
      - run: cargo check -p org-members --no-default-features --features serde
      - run: |
          cargo check -p org-members --no-default-features --features serde \
            --target wasm32-unknown-unknown
      # person builds for wasm32, with and without its default `serde`
      # feature.
      - run: cargo check -p person --target wasm32-unknown-unknown
      - run: cargo check -p person --no-default-features --target wasm32-unknown-unknown

  # The statement-coverage gate, running all three per-unit coverage targets
  # the merge gates run (`make coverage` = coverage-org-members +
  # coverage-on-chain-client + coverage-person). Floors live in the Makefile and ratchet upward
  # only. This covers the statement half of the class C target; decision
  # coverage is not measured in CI (docs/adr/2026-09-01-safety-class-c.md).
  # Branch coverage needs nightly; for person the Makefile records it as
  # measured by hand on nightly: 28 of 28 branches, re-measured 2026-10-05
  # (see the person floors there).
  #
  # Note that the floors were calibrated on aarch64-darwin and are enforced
  # here on x86_64-linux, against a floating `stable` toolchain and an
  # untracked root Cargo.lock. LLVM's line mapping can differ across those, so
  # the floors carry a point of slack; if this job ever fails on a percentage
  # that looks identical to the local one, that difference is the first thing
  # to check, not the last.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: make coverage

  # fetch-depth: 0 is for the pull-request steps below, which resolve
  # `origin/<base>` and ask which files the branch touched. check-ids.sh needs
  # no history of its own — it has no base gate and scans the working tree.
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Multi-unit repository since 2026-09-05 (.guardrails/units.yaml). The
      # repository-level gates run once; the unit gates run per unit over the
      # UNION of declared units — this is the base-branch shape, where there is
      # no change under review and so no impact set to narrow to. The unit
      # list comes from --list, never a hand-written matrix, so a unit added to
      # the manifest is gated here the same day. A bare `check-trace.sh` with
      # no GR_CONFIG is exit 2 in a manifest repository, deliberately.
      - run: .guardrails/scripts/check-units.sh
      # A failed `--list` inside a for-list is not caught by `set -e`: the loop
      # would run zero times and the step would pass — a skipped suite wearing
      # a green light. Hence the explicit capture and exit 2.
      - run: |
          set -e
          units=$(.guardrails/scripts/check-units.sh --list) || exit 2
          for u in $units; do
            echo "== $u"
            GR_CONFIG="$u/.guardrails/config.yaml" .guardrails/scripts/check-trace.sh
          done

      # --allow-draft-files on a pull request and NOT on a push, because the
      # two ask different questions. A DRAFT-<branch>-<slug>.md ledger file is
      # legitimate for the whole life of a change and is renamed by
      # finalize-docs.sh at merge-change step 3 — so failing a PR for one would
      # redden every change that adds an item. On the base branch a draft file
      # means the rename did not happen, which is a real defect.
      - if: github.event_name == 'pull_request'
        run: |
          set -e
          units=$(.guardrails/scripts/check-units.sh --list) || exit 2
          for u in $units; do
            GR_CONFIG="$u/.guardrails/config.yaml" .guardrails/scripts/check-ids.sh --allow-draft-files
          done
      - if: github.event_name != 'pull_request'
        run: |
          set -e
          units=$(.guardrails/scripts/check-units.sh --list) || exit 2
          for u in $units; do
            GR_CONFIG="$u/.guardrails/config.yaml" .guardrails/scripts/check-ids.sh
          done

      # Signature checking belongs on the BASE BRANCH, not on the pull request.
      # Non-negotiable 2 requires the squash commit on master to be signed and
      # says nothing about the commits behind it; the project rule
      # (AGENTS.md, user preferences) makes worktree commits deliberately
      # UNSIGNED. Running this over a PR range would therefore fail every
      # change for doing exactly what the rules prescribe — measured on this
      # change: `check-signing.sh master..HEAD` → UNSIGNED, exit 1.
      #
      # With no range argument the script checks HEAD alone, which on a push to
      # master is precisely the squash commit that must be signed.
      #
      # Non-strict, because --strict fails anything git cannot VERIFY and a
      # runner holds neither the signer's public key nor an allowed_signers
      # file. It still catches the failure that actually threatens this
      # repository: a commit with no signature at all. To tighten: publish the
      # committers' public keys to the workflow, then add --strict.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: .guardrails/scripts/check-signing.sh

      # The verification-record gate. It asks about the change under review, so
      # it can only run on a pull request; on a push to the base branch it
      # exits 2, there being no change under review there.
      #
      # History worth keeping, because it explains why this step was added:
      # under guardrails 0.4.0 this gate could not run on macOS at all —
      # check-review.sh passed a newline-separated list through `awk -v`, which
      # the BWK awk shipped with macOS rejects — so CI was the only place it
      # could execute. The 0.5.1 upgrade fixed that, and it now runs locally at
      # merge-change step 6c.
      #
      # The catch that remains: this project's working practice is a local
      # signed squash merge straight onto master, with no pull request, so this
      # step never fires. That is no longer a gap in enforcement (step 6c
      # covers it on the merging machine) but it does mean CI provides no
      # independent backstop for the review evidence — which matters more under
      # class C, where the review must be thorough. Adopting pull
      # requests is what would close that.
      - if: github.event_name == 'pull_request'
        run: .guardrails/scripts/check-review.sh --branch "${{ github.head_ref }}"
