[package]
name = "org-io"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "ODS: all IO for an Organisation — the chain read and write, the user's signatory key, the own-admin check"
publish = false

[features]
default = []
# The development-only signing seed (REQ-8zuka3): the one read of
# ODS_ADMIN_SEED is compiled only with this feature. No release build enables it.
dev-seed = []
# Test-only constructors and fakes (`test_support`); never in production builds.
# Carries org-node's test-only seams with it (org-node is a dependency since T5).
test-support = ["org-node/test-support"]

[dependencies]
# Features mirror on-chain-client's pins so the subxt types unify (the reason
# org-node's manifest gave for the same line).
on-chain-client = { path = "../on-chain-client", default-features = false, features = ["dev-rpc", "write"] }
subxt-signer = { version = "0.50", default-features = false, features = ["sr25519", "subxt"] }
zeroize = "1.9"
# The Organisation logic org-io feeds values to and takes values from
# (docs/adr/2026-10-06-org-io-unit.md); `app` until S4 narrows it.
org-node = { path = "../org-node", features = ["app"] }
# The chain connection and read (SDD-z85ux9, moved from org-node 2026-10-07);
# the same pins org-node's manifest gave, so the subxt types unify.
subxt = { version = "0.50", default-features = false, features = ["native", "jsonrpsee", "reconnecting-rpc-client"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
async-trait = "0.1"
hex = "0.4"
# org-node's versions: `submit_commit_send` takes an `iroh::EndpointAddr`, and
# the handle's operations take org-node's random-number source.
iroh = "0.98"
rand_core = "0.6"

[dev-dependencies]
bolero = "0.13"
# The paused clock of the 90-second bound's test (LLR-be3zv9).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
# `OsRng`, as org-node's and the app's tests use.
rand = "0.8"
# Chopsticks test harness (tests/common, used by preflight): chopsticks spawn +
# subxt client. Moved with the preflight from org-node's dev-dependencies,
# which mirror on-chain-client's for the same helpers.
jsonrpsee = { version = "0.26", default-features = false, features = ["ws-client", "http-client"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
libc = "0.2"

[lints]
workspace = true

# The operator preflight (moved from org-node 2026-10-07). No
# `required-features`: org-io always has the chain.
[[bin]]
name = "preflight"

# Chopsticks-only: spawns a fork and needs on-chain/scripts/node_modules, so it
# is not in verify_commands (as in org-node).
[[test]]
name = "preflight"
path = "tests/preflight.rs"

# The seed and co-signer parse never panics (LLR-4ax2m6, LLR-9fy622) and its
# errors carry no part of the value (LLR-gc6kwy).
[[test]]
name = "fuzz_seed_parse"
path = "tests/fuzz_seed_parse/fuzz_target.rs"
harness = false

# The development seed read (LLR-rgdx22) mutates the environment; its tests
# run in their own binary, one at a time under a lock, and only with dev-seed.
[[test]]
name = "dev_seed_env"
path = "tests/dev_seed_env.rs"
required-features = ["dev-seed"]

# Submission (LLR-qhjp6g, LLR-be3zv9, LLR-9r2bxd) and the receive sequence
# (LLR-7pj5af), over `test_support::FakeChain`.
[[test]]
name = "submit_flow"
path = "tests/submit_flow.rs"
required-features = ["test-support"]

[[test]]
name = "receive_order"
path = "tests/receive_order.rs"
required-features = ["test-support"]

# The own-admin check (LLR-qhyc3n, LLR-vyd5d3, LLR-c9fyun): the pure rule,
# then the handle over `test_support::FakeChain`'s signatory-set slots.
[[test]]
name = "signatory_rule"
path = "tests/signatory_rule.rs"
required-features = ["test-support"]
