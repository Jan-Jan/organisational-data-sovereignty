# guardrails configuration for the `org-io` unit — flat schema only:
#   `key: value` scalars and two-space `- item` lists, every key at column one,
#   set once, in its own form (LIST keys: strict_paths, test_paths,
#   verify_commands, coverage_command, depends_on, segregated_from; everything
#   else a scalar). The schema is CLOSED and validated before any gate runs;
#   the full rule list, with the reason each rule exists, is the header of
#   templates/config.yaml in the guardrails repository this was copied from.
#
# This is a UNIT config (.guardrails/units.yaml at the repository root names
# the units). Every doc_* value and every strict_paths/test_paths entry must
# sit inside this unit's own directory, and doc_verification must NOT be set —
# the verification record is repository-level (docs/verification).
#
# Scripts run from the repository root, so paths and commands below are
# repository-relative.
guardrails_version: 0.5.1
guardrails_commit: 2bc3cca04b75e1205d1c79a8e7b40c302036bf6f

# IEC 62304 software safety class. C: org-io submits the chain write that
# changes who is a Member, holds the user's own signatory key that authorises
# it (there is no Organisation-wide signing key), and reads
# the chain state every verification is judged against
# (docs/adr/2026-10-06-org-io-unit.md; owner ruling of the same day: org-io is
# class C).
# Its providers org-node and on-chain-client are class C too.
safety_class: C

id_prefixes: REQ HAZ RC SDD LLR PR ADR

# Canonical document locations.
doc_srs: org-io/docs/requirements
doc_rmf: org-io/docs/risk
doc_sad: org-io/docs/architecture
doc_soup: org-io/docs/architecture/soup.md
doc_problems: org-io/docs/problems

# The source scan covers the crate's source, the ledger directories and the
# unit's AGENTS.md.
strict_paths:
  - org-io/src
  - org-io/docs
  - org-io/AGENTS.md

# The crate's integration tests and fuzz targets; the `verifies:` search runs
# over them.
test_paths:
  - org-io/tests

# The first line runs the library and every test target over
# `test_support` (`FakeChain`, `MemoryKeychain`, Loopback endpoints and the
# in-process relay); the second runs the targets that need `dev-seed` too;
# then a build, and clippy with both features and with none, so the library
# and every target that needs no feature are linted as a production build
# compiles them. The chopsticks-dependent targets `preflight` and
# `chain_writer_contract` are excluded: each spawns a chopsticks fork and
# needs on-chain/scripts/node_modules. `keychain_contract`'s OS-keychain run
# is `#[ignore]`d and runs only with ODS_REAL_KEYCHAIN_TESTS=1.
verify_commands:
  - cargo test -p org-io --features test-support --lib --test key_custody_config --test fuzz_seed_parse --test signatory_key --test absences --test chain_read_rule --test signatory_rule --test app_boundary --test open --test keychain --test keychain_contract --test store_files --test transport_handshake --test transport_networked --test endpoints --test preflight_transport --test receive_step --test acknowledgement_inbound --test send_fanout --test invitation_exchange --test expectations_met --test rng_source --test person --test persona_creation --test propose --test chain_write --test verification --test requests --test acknowledgements
  - cargo test -p org-io --features test-support,dev-seed --test key_custody_config --test signatory_key --test dev_seed_env
  - cargo build -p org-io
  - cargo clippy -p org-io --all-targets --features test-support,dev-seed -- -D warnings
  - cargo clippy -p org-io --all-targets -- -D warnings

problem_age_days: 30
# 15, by owner ruling 2026-10-15, which files a review's larger lows as one
# open umbrella report.
problem_open_max: 15

# Statement and branch coverage (owner ruling, 2026-10-06); the floors and
# their measurements are in the root Makefile (ORG_IO_LINES, ORG_IO_REGIONS,
# ORG_IO_BRANCHES).
coverage_command:
  - make coverage-org-io
  - make coverage-branch-org-io

expectation_age_days: 90
expectation_open_max: 10

# The dependency assessments are in docs/plans/2026-10-06-org-io-create.md
# §5. Both providers are class C, so the class floor (MISCLASSED-DEPENDENCY)
# has nothing to convict and no segregated_from: entry is needed. The edge
# to person is declared when org-io's code first names a person type.
depends_on:
  - org-node
  - on-chain-client
# segregated_from:
#   - <unit> (RC-xxxxxx)
