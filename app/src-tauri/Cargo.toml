[workspace]

[package]
name = "ods-poc"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "ods_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
hex = "0.4"
# No rand: org-io holds the one random source (LLR-vj5s28), and no command passes an rng.
# No base64, postcard or iroh: the invitation Blobs are org-node's, the
# peer-address parse and the transport org-io's; the app names no iroh type
# and no Blob format.
# The app's one way in to org-node, the chain and the signatory key
# (docs/adr/2026-10-06-org-io-unit.md). The app names no other unit and no
# chain library (org-io/tests/app_boundary.rs).
org-io = { path = "../../org-io" }

[features]
# Gates the test-only constructors and the integration test targets below.
# Every `[[test]]` entry declares it via `required-features`, so naming a
# target with the feature off is a cargo ERROR rather than a silent skip —
# the property on-chain-client's nine targets rely on. It turns on
# org-io's test-support too, for `AppState`'s test constructors,
# which open the handle over org-io's in-memory keychain and substitute
# chain.
test-support = ["org-io/test-support"]
# A development build: org-io reads the signing seed (ODS_ADMIN_SEED) only
# with this feature (`npm run tauri dev -- --features dev-seed`). No release
# build enables it.
dev-seed = ["org-io/dev-seed"]

[dev-dependencies]
# `tauri/test` supplies mock_builder / mock_context / get_ipc_response, used by
# the IPC suite (tests/ipc.rs). Feature unification means the dev build of the lib also
# sees `test`; that is harmless and is why this is a dev-dependency rather than
# an optional feature of the main entry.
tauri = { version = "2", features = ["test"] }
tempfile = "3"
# org-io's test-only substitutes (`org_io::test_support::FakeChain`, the
# handle's `OrgIo::for_test`) for the app's integration tests.
org-io = { path = "../../org-io", features = ["test-support"] }
# tokio's paused clock, for the 90-second write bound in
# tests/verification.rs.
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread", "time"] }

[[test]]
name = "startup_policy"
required-features = ["test-support"]

[[test]]
name = "connection_status"
required-features = ["test-support"]

[[test]]
name = "org_id_parsing"
required-features = ["test-support"]

[[test]]
name = "receiver_events"
required-features = ["test-support"]

[[test]]
name = "receiver_guard"
required-features = ["test-support"]

[[test]]
name = "ipc"
required-features = ["test-support"]

[[test]]
name = "csp_policy"
required-features = ["test-support"]

# The write and the verification it asks, with the verification's
# entries, sends and requests; and the periodic verification.
[[test]]
name = "verification"
required-features = ["test-support"]

[[test]]
name = "periodic"
required-features = ["test-support"]
