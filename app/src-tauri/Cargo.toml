[workspace]

[package]
name = "ods-poc"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false

[lib]
name = "ods_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
hex = "0.4"
async-trait = "0.1"
rand = "0.8"
postcard = { version = "1", features = ["use-std"] }
iroh = { version = "0.98" }
# Needed by state.rs connect_chain (only used when ODS_CHAIN_WS is set at runtime).
subxt = { version = "0.50", default-features = false, features = ["native", "jsonrpsee"] }
subxt-signer = { version = "0.50", default-features = false, features = ["sr25519", "subxt"] }
on-chain-client = { path = "../../on-chain-client", default-features = false, features = ["dev-rpc"] }
org-node = { path = "../../org-node", features = ["app"] }

[features]
# Gates the test-only constructors and the integration test targets below.
# Every `[[test]]` entry declares it via `required-features`, so naming a
# target with the feature off is a cargo ERROR rather than a silent skip —
# the property on-chain-client's nine targets rely on.
test-support = []

[dev-dependencies]
# `tauri/test` supplies mock_builder / mock_context / get_ipc_response, used by
# the IPC suite in T2. Feature unification means the dev build of the lib also
# sees `test`; that is harmless and is why this is a dev-dependency rather than
# an optional feature of the main entry.
tauri = { version = "2", features = ["test"] }
tempfile = "3"
# `tests/receiver_events.rs` constructs `OrgNodeError::Trie(_)`, whose payload
# is an `org_members::OrgMembersError`. org-node does not re-export the type and
# an integration test crate cannot reach a transitive dependency, so the test
# needs the path dependency of its own. Same features as org-node's entry, so
# feature unification changes nothing about the lib build.
org-members = { path = "../../org-members", default-features = false, features = ["std", "serde"] }

[[test]]
name = "startup_policy"
required-features = ["test-support"]

[[test]]
name = "connection_status"
required-features = ["test-support"]

[[test]]
name = "org_id_parsing"
required-features = ["test-support"]

[[test]]
name = "receiver_events"
required-features = ["test-support"]

[[test]]
name = "receiver_guard"
required-features = ["test-support"]

[[test]]
name = "ipc"
required-features = ["test-support"]
