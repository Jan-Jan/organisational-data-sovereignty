[workspace]

[package]
name = "ods-poc"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "ods_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
hex = "0.4"
rand = "0.8"
# *S4, task T15 (2026-10-14):* `base64`, `postcard` and `iroh` left with the
# invitation Blobs (org-node's), the peer-address parse and the transport
# (org-io's); the app names no iroh type and no Blob format.
# The app's one way in to org-node, the chain and the signatory key
# (docs/adr/2026-10-06-org-io-unit.md). Since S2 the app names no other unit
# and no chain library (org-io/tests/app_boundary.rs).
org-io = { path = "../../org-io" }

[features]
# Gates the test-only constructors and the integration test targets below.
# Every `[[test]]` entry declares it via `required-features`, so naming a
# target with the feature off is a cargo ERROR rather than a silent skip —
# the property on-chain-client's nine targets rely on. *S4, task T15:* it
# turns on org-io's test-support too, for `AppState`'s test constructors,
# which open the handle over org-io's in-memory keychain and substitute
# chain.
test-support = ["org-io/test-support"]
# A development build: org-io reads the signing seed (ODS_ADMIN_SEED) only
# with this feature (`npm run tauri dev -- --features dev-seed`). No release
# build enables it.
dev-seed = ["org-io/dev-seed"]

[dev-dependencies]
# `tauri/test` supplies mock_builder / mock_context / get_ipc_response, used by
# the IPC suite in T2. Feature unification means the dev build of the lib also
# sees `test`; that is harmless and is why this is a dev-dependency rather than
# an optional feature of the main entry.
tauri = { version = "2", features = ["test"] }
tempfile = "3"
# org-io's test-only substitutes (`org_io::test_support::FakeChain`, the
# handle's `OrgIo::for_test`) for the app's integration tests.
org-io = { path = "../../org-io", features = ["test-support"] }

[[test]]
name = "startup_policy"
required-features = ["test-support"]

[[test]]
name = "connection_status"
required-features = ["test-support"]

[[test]]
name = "org_id_parsing"
required-features = ["test-support"]

[[test]]
name = "receiver_events"
required-features = ["test-support"]

[[test]]
name = "receiver_guard"
required-features = ["test-support"]

[[test]]
name = "ipc"
required-features = ["test-support"]

[[test]]
name = "csp_policy"
required-features = ["test-support"]

# The state_assembly target left on 2026-10-15 (S4, owner ruling of that
# day): its one remaining test,
# `init_opens_the_store_once_even_when_the_connect_is_refused`, was
# "Deleted 2026-10-15 by owner ruling: no app item states it; covered by
# org-io's store-opening tests and the app's startup-refusal tests." With no
# test left in `tests/state_assembly.rs`, the file and this target went too.

# The invitation target left on 2026-10-14 (S4 task T13 of
# docs/plans/2026-10-06-org-io-transport.md): its fourteen exchange tests
# moved to org-io's `invitation_exchange` with the exchange.

# S3b-io part 1's reconcile target (merged into S4 2026-10-14; S3b-io's
# `submit_flow` and `invitation` entries are S4's removed targets, T12, T13).
[[test]]
name = "reconcile"
required-features = ["test-support"]
