# guardrails configuration for the `app` unit — flat schema only:
#   `key: value` scalars and two-space `- item` lists, every key at column one,
#   set once, in its own form (LIST keys: strict_paths, test_paths,
#   verify_commands, coverage_command, depends_on, segregated_from; everything
#   else a scalar). The schema is CLOSED and validated before any gate runs;
#   the full rule list, with the reason each rule exists, is the header of
#   templates/config.yaml in the guardrails repository this was copied from.
#
# This is a UNIT config (.guardrails/units.yaml at the repository root names
# the units). Every doc_* value and every strict_paths/test_paths entry must
# sit inside this unit's own directory, and doc_verification must NOT be set —
# the verification record is repository-level (docs/verification).
#
# Scripts run from the repository root, so paths and commands below are
# repository-relative.
guardrails_version: 0.5.1
guardrails_commit: 35570e874193e9082b9e5e690efedb355cf36768

# IEC 62304 software safety class. C: the app is the shipped product — the
# surface through which an organisation admits, verifies and revokes members.
# It is a thin shell over org-node, but the shell is where the user's intent
# becomes a membership change, and a wrong display or a mis-wired command
# reaches the same pathway to serious injury the 2026-09-01 ADR names. See
# docs/adr/2026-09-05-units-and-per-unit-classes.md.
safety_class: C

id_prefixes: REQ HAZ RC SDD LLR PR ADR

# Canonical document locations. README-only ledgers as of 2026-09-05.
doc_srs: app/docs/requirements
doc_rmf: app/docs/risk
doc_sad: app/docs/architecture
doc_soup: app/docs/architecture/soup.md
doc_problems: app/docs/problems

# Both sides of the IPC boundary, widened 2026-09-14 with the unit's first
# requirements. The SvelteKit frontend is in scope because six of this unit's
# requirements are realised there — REQ-vgr7s2, REQ-he8ejb, REQ-a83vqr,
# REQ-akt4p7, REQ-rq8g2v, REQ-wu6z9p — and FIVE of them are realised there and
# NOWHERE else: all but REQ-vgr7s2, which also has a Rust half in ipc.rs.
#
# Re-measured 2026-09-15 (it read "five ... three of them" until then, measured
# on 2026-09-14 and overtaken twice). Two things moved it: REQ-wu6z9p was minted
# by the first independent review and is gated only by app/tests, and REQ-he8ejb
# became frontend-only when its two Rust annotations were retracted as
# unbearable — the handler's check runs AFTER the command is invoked, and the
# requirement says "before any command is invoked" (see ipc.rs's own note).
# The verification row's outcome, the listener teardown, the receiver-error
# routing and the pre-invocation identifier check are frontend decisions with no
# Rust half at all.
strict_paths:
  - app/src-tauri/src
  - app/src

# Both test trees, added 2026-09-14 with the unit's first tests: cargo
# integration targets under app/src-tauri/tests (six then, eight since
# 2026-10-05; each declared in Cargo.toml with
# `required-features = ["test-support"]`) and four vitest files under
# app/tests. The placeholder file that used to hold app/src-tauri/tests open
# is deleted — the directory now holds real test targets.
test_paths:
  - app/src-tauri/tests
  - app/tests

# Measured 2026-09-14 at the end of the app risk analysis change.
#
# The cargo entry names all eight targets explicitly because each is declared
# `required-features = ["test-support"]`: naming a target with the feature off
# is a cargo ERROR rather than a silent skip, which is what makes this entry
# fail loudly if the feature or a target is ever dropped. Measured:
#   startup_policy 12 + connection_status 10 + org_id_parsing 14
#   + receiver_events 27 + receiver_guard 6 + ipc 9 = 78 tests (2026-09-14).
# Four of the six rose during the change, each from a gate or review finding:
# receiver_events 14 -> 27 (REQ-tw4cb5 was verified on one fixture rather than
# as a property; six more for REQ-kn5rtx; four more when the terminal-error
# detection turned out never to have fired), org_id_parsing 11 -> 14 and
# ipc 8 -> 9 (a doubled `0x` prefix was silently normalised at two boundary
# parsers), and connection_status 8 -> 10 (REQ-bvx4nh's data-directory clause
# was gated by no test annotated to it).
# Measured again 2026-10-05 (agent sandbox, CARGO_HOME=/tmp/cargo_home_fuzz),
# after later changes and the org-node type-safety change added tests:
#   startup_policy 12 + connection_status 10 + org_id_parsing 14
#   + receiver_events 28 + receiver_guard 6 + ipc 12 = 82 tests.
# A seventh target, csp_policy (17 tests), was added 2026-10-05 with the
# Content-Security-Policy fix (REQ-cj5jmx, owner ruling 4 of
# docs/plans/2026-10-05-app-architecture.md): 82 + 17 = 99 tests, measured.
# An eighth target, state_assembly (3 tests), was added 2026-10-05 by task T3
# of the same plan, with the unit's first low-level requirements; T3 also
# added tests to four existing targets (startup_policy, receiver_events, ipc,
# csp_policy). Measured after T3:
#   startup_policy 13 + connection_status 10 + org_id_parsing 14
#   + receiver_events 30 + receiver_guard 6 + ipc 28 + csp_policy 18
#   + state_assembly 3 = 122 tests.
# Review round 1 of the same plan (task R1) added tests to two targets:
#   startup_policy 13 + connection_status 10 + org_id_parsing 14
#   + receiver_events 30 + receiver_guard 6 + ipc 33 + csp_policy 24
#   + state_assembly 3 = 133 tests.
# Merged 2026-10-06 with worktree-person-shared-types (the switch to person's
# identity types, trimmed by docs/plans/2026-10-05-switch-trim.md): its
# receiver_events changes replace tests of refusals org-node no longer raises;
# Measured 2026-10-06 by that change's final gate: receiver_events 32, so
#   startup_policy 13 + connection_status 10 + org_id_parsing 14
#   + receiver_events 32 + receiver_guard 6 + ipc 33 + csp_policy 24
#   + state_assembly 3 = 135 tests; vitest 36.
#
# `npm run check` is `svelte-kit sync && svelte-check`; it type-checks app/src
# AND app/tests (measured 2026-09-14 — the generated .svelte-kit/tsconfig.json
# includes ../tests/**). 0 errors, 1 pre-existing @types/node warning.
#
# `npm run test` is `svelte-kit sync && vitest run`; the sync is part of the
# script rather than assumed from the entry above, so the entry does not
# depend on its neighbour's side effects. 30 tests across four files; 35 after
# task T3 of docs/plans/2026-10-05-app-architecture.md and 36 after its task
# T4 (2026-10-05, measured).
#
# Both npm entries need app/node_modules, which is gitignored: the merging
# machine must run `npm --prefix app ci` first. A fresh worktree does not have
# it.
verify_commands:
  - cargo test --manifest-path app/src-tauri/Cargo.toml --features test-support --test startup_policy --test connection_status --test org_id_parsing --test receiver_events --test receiver_guard --test ipc --test csp_policy --test state_assembly
  - npm --prefix app run check
  - npm --prefix app run test

problem_age_days: 30
# Raised from 10 to 15 on 2026-10-05 by owner ruling 2 of
# docs/plans/2026-10-05-app-architecture.md: the architecture change books five
# new reports (PR-8vh53d, PR-cu2h2g, PR-uxj7bg, PR-bu6mau, PR-7zz76t) on top of
# the five still open from 2026-09-14, 10 open in all. Each is deferred work,
# not a ruling not to fix. The same limit org-node was given on the same date.
problem_open_max: 15

# No coverage_command. The first half of this note used to read "nothing to
# measure until the crate has tests" and is no longer true: as of 2026-09-14 the
# unit has 78 cargo tests (122 as measured 2026-10-05, after the architecture
# change) and 30 vitest tests (36 after it). What remains true is the second
# half — under class C the absence is a gap against a mandatory requirement, and
# it is recorded in docs/plans/2026-09-05-ratchet-setup.md.
#
# Not adding one here was the owner's explicit decision on 2026-09-14: tooth 5
# sets floors for org-node and app together, on one measurement basis, rather
# than setting one here in isolation. Nothing in this unit's hazard register
# rests on a coverage figure, because there is none.
# coverage_command:
#   - make coverage-app

expectation_age_days: 90
expectation_open_max: 10

# Declared 2026-09-06 after the dependency assessment in
# docs/plans/2026-09-06-dependency-edges.md. Both providers are class C, so
# the class floor (MISCLASSED-DEPENDENCY) has nothing to convict and no
# segregated_from: entry is needed.
#
# Updated 2026-09-14. This note used to say "the app has no requirements yet, so
# it records no expects: items". It now has twenty-two, written by the hazard
# analysis in app/docs/risk/, and one expectation: REQ-x3c8n2 expects org-node
# to distinguish a permanent transport-endpoint failure from a transient one by
# the error's TYPE, because the receiver loop currently decides by matching a
# substring of a message org-node formats and no gate in either unit protects.
# Until org-node defines an exported requirement carrying
# `satisfies: REQ-x3c8n2`, this unit's run reports UNMET-EXPECTATION and
# org-node's reports one open expectation standing against it. Due 2026-12-13.
depends_on:
  - org-node
  - on-chain-client
# segregated_from:
#   - <unit> (RC-xxxxxx)
