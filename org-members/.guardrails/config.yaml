# guardrails configuration for the `org-members` unit — flat schema only:
#   `key: value` scalars and two-space `- item` lists, every key at column one,
#   set once, in its own form (LIST keys: strict_paths, test_paths,
#   verify_commands, coverage_command, depends_on, segregated_from; everything
#   else a scalar). The schema is CLOSED and validated before any gate runs;
#   the full rule list, with the reason each rule exists, is the header of
#   templates/config.yaml in the guardrails repository this was copied from.
#
# This is a UNIT config (.guardrails/units.yaml at the repository root names
# the units). Two constraints follow that a single-unit config does not have:
# every doc_* value and every strict_paths/test_paths entry must sit inside
# this unit's own directory, and doc_verification must NOT be set — the
# verification record is repository-level (docs/verification, one record per
# change, read by check-review.sh by branch).
#
# Scripts run from the repository root, so paths and commands below are
# repository-relative, exactly as they were in the root config this replaces.
guardrails_version: 0.5.1

# The commit the installed scripts were copied from — the checkable half of
# the tool-qualification basis (docs/plans/2026-09-05-ratchet-setup.md).
guardrails_commit: 35570e874193e9082b9e5e690efedb355cf36768

# IEC 62304 software safety class. C: org-members is the membership authority
# — the record every access decision derives from. See
# docs/adr/2026-09-05-units-and-per-unit-classes.md and, for the pathway to
# serious injury, docs/adr/2026-09-01-safety-class-c.md.
safety_class: C

# ID prefixes managed by the check/finalize scripts.
# LLR = low-level requirements (design data, live in the SAD).
# PR  = problem reports.
id_prefixes: REQ HAZ RC SDD LLR PR ADR

# Canonical document locations — the ledgers moved here from docs/ on
# 2026-09-05 with their history; the item IDs are unchanged.
doc_srs: org-members/docs/requirements
doc_rmf: org-members/docs/risk
doc_sad: org-members/docs/architecture
doc_soup: org-members/docs/architecture/soup.md
doc_problems: org-members/docs/problems

# Paths where traceability is enforced.
strict_paths:
  - org-members/src

# Paths searched for `verifies:` test annotations.
test_paths:
  - org-members/tests

# Commands merge-change and verify-before-merge must run and pass
# (docs/adr/2026-10-03-quint-conformance-gate.md). `cargo test -p
# org-members` includes mbt_conformance, which runs quint through
# quint-connect and FAILS, naming the cause, when quint is absent or
# ~/.quint is unwritable (decision 9). `quint --version` puts the Quint
# version into every verification record (decision 7: not pinned).
# `quint test` uses the typescript backend; the simulator run uses the
# default rust backend (decision 9, amended). org-node/quint/protocol.qnt
# imports this unit's exported model interface (membership_types.qnt);
# org-node depends on org-members, so check-units.sh --impact runs org-node's
# gate — which typechecks that importer — on every org-members change
# (part 2, 2026-10-03).
verify_commands:
  - cargo test -p org-members
  - quint --version
  - quint typecheck org-members/quint/membership_types.qnt
  - quint typecheck org-members/quint/membership.qnt
  - quint typecheck org-members/quint/membership_mbt.qnt
  - quint test org-members/quint/membership.qnt --backend=typescript
  - quint run org-members/quint/membership_mbt.qnt --invariant=mbtInv --max-steps=15 --max-samples=1000

# Problem-report triage limits: whole numbers, both mean "more than".
problem_age_days: 30
problem_open_max: 10

# Structural coverage, judged against the class C target (statement AND
# decision). No check script reads this key: it is consumed by
# verify-before-merge step 5 and by the `coverage` and `coverage-branch` jobs
# in .github/workflows/rust.yml. `make coverage-org-members` enforces a line and a
# region floor (Makefile; measured 2026-08-26: 93.50% lines / 92.20%
# regions, floors one point below, ratcheting upward only). Decision coverage
# is measured since 2026-10-06 by `make coverage-branch-org-members` on the
# pinned nightly (Makefile BRANCH_TOOLCHAIN; 123 of 124 branches, floor 98%).
# Requires cargo-llvm-cov, plus llvm-tools-preview on both stable and the
# pinned nightly, on the merging machine.
coverage_command:
  - make coverage-org-members
  - make coverage-branch-org-members

# Expectation triage limits (consumer REQs carrying `expects: <unit>`). Shipped
# set; meaningful once this unit declares a dependency.
expectation_age_days: 90
expectation_open_max: 10

# Multi-unit keys. No edges declared in this tooth — see units.yaml.
# Declared 2026-10-04 after the dependency assessment in
# docs/plans/2026-10-04-person-shared-types.md. person is class C, so the
# class floor has nothing to convict.
depends_on:
  - person
