# guardrails configuration for the `org-node` unit — flat schema only:
#   `key: value` scalars and two-space `- item` lists, every key at column one,
#   set once, in its own form (LIST keys: strict_paths, test_paths,
#   verify_commands, coverage_command, depends_on, segregated_from; everything
#   else a scalar). The schema is CLOSED and validated before any gate runs;
#   the full rule list, with the reason each rule exists, is the header of
#   templates/config.yaml in the guardrails repository this was copied from.
#
# This is a UNIT config (.guardrails/units.yaml at the repository root names
# the units). Every doc_* value and every strict_paths/test_paths entry must
# sit inside this unit's own directory, and doc_verification must NOT be set —
# the verification record is repository-level (docs/verification).
#
# Scripts run from the repository root, so paths and commands below are
# repository-relative.
guardrails_version: 0.5.1
guardrails_commit: 2bc3cca04b75e1205d1c79a8e7b40c302036bf6f

# IEC 62304 software safety class. C: org-node holds the keys and makes the
# trust decisions through which a member's access is granted or withdrawn.
# See docs/adr/2026-09-05-units-and-per-unit-classes.md.
safety_class: C

id_prefixes: REQ HAZ RC SDD LLR PR ADR

# Canonical document locations. A consumer may not cite a provider's controls
# and a provider may not cite a consumer's items, so every `affects:` in
# doc_problems names an org-node item.
doc_srs: org-node/docs/requirements
doc_rmf: org-node/docs/risk
doc_sad: org-node/docs/architecture
doc_soup: org-node/docs/architecture/soup.md
doc_problems: org-node/docs/problems

# Every line of org-node's production code is under trace discipline.
strict_paths:
  - org-node/src

test_paths:
  - org-node/tests

# The cargo line names every test target explicitly, so a target added to the
# crate is not silently pulled in and no target (the bolero fuzz targets
# among them) silently drops out. Every file under org-node/tests that is a
# target is named; `support/` is a shared module, not a target.
# `--features app,test-support` is REQUIRED: cargo refuses an explicit
# `--test` whose `required-features` are off. `--lib` therefore compiles the
# library with `app` plus `test-support`: `app` is the configuration org-node
# ships in; `test-support` is never enabled in production builds (Cargo.toml)
# and exposes only gated test constructors and accessors, so the lib under
# test differs from the shipped lib by that feature alone. org-node is
# sans-IO and every test is synchronous.
# The bolero targets (fuzz_envelope_decode,
# fuzz_first_admission_base, fuzz_wire_decode, fuzz_unseal,
# fuzz_invitation_parse) report no pass count: each prints its iteration
# total and exits on its one-second budget. Nothing here measures whether a
# fuzz target reaches the code it is named for.
# Per-target pass counts are recorded in each change's verification record
# (docs/verification), not here.
#
# The quint entries check the protocol models in org-node/quint/
# (docs/adr/2026-10-03-quint-conformance-gate.md): both typechecks and the
# five simulator invariants, each with an explicit --max-steps. Quint is not
# pinned; `quint --version` puts the version into every verification record.
# The simulator runs use the default rust backend and need a writable quint
# home (QUINT_HOME). These check the system model only: org-node has no
# conformance test, so a Rust change to org-node is not checked against the
# model.
# The all-targets clippy line runs last.
#
# The list must be contiguous: a comment between the key and its first item,
# or between two `- item` lines, fails the config validator.
verify_commands:
  - cargo test -p org-node --features app,test-support --lib --test service_stories --test fuzz_envelope_decode --test fuzz_first_admission_base --test fuzz_wire_decode --test wire_frame_bound --test store_at_rest --test admission_sender --test value_types --test key_custody --test envelope_binding --test service_lifecycle --test encoding_golden --test node_value_types --test persona_records --test secret_redaction --test organisation_key --test receive_chain_reads --test absences --test provisional_store --test revocation --test commit_workflow_errors --test sealed_store --test fuzz_unseal --test receive_path --test outgoing_bodies --test invitation --test fuzz_invitation_parse --test epoch_store --test person_store --test proposals --test verification --test organisation_request --test own_removal --test fuzz_check_received
  - quint --version
  - quint typecheck org-node/quint/protocol.qnt
  - quint typecheck org-node/quint/ods_instances.qnt
  - quint run org-node/quint/protocol.qnt --invariant=forkSafety --max-steps=16 --max-samples=5000
  - quint run org-node/quint/protocol.qnt --invariant=revocationSafety --max-steps=16 --max-samples=5000
  - quint run org-node/quint/protocol.qnt --invariant=revokedExcludedFromOrgSecret --max-steps=16 --max-samples=5000
  - quint run org-node/quint/protocol.qnt --invariant=tauWindow --max-steps=16 --max-samples=5000
  - quint run org-node/quint/protocol.qnt --invariant=convergence --max-steps=16 --max-samples=5000
  - cargo clippy -p org-node --all-targets --features app,test-support -- -D warnings

# 60 days, by owner ruling (confirmed 2026-10-08; decision D1 of
# docs/plans/2026-10-08-org-io-publish.md): PR-vt244s is kept open until
# S3b-io part 2 merges. The figure is the smallest that plausibly covers that
# work with a week for review rounds; it is not a ruling not to fix, and it
# applies to every org-node report.
problem_age_days: 60
# 15, by owner ruling (2026-10-05): each open report is genuine deferred
# work, not a ruling not to fix.
problem_open_max: 15

# No coverage_command: org-node's coverage has never been measured. Under
# class C statement AND decision coverage are required, so this is a gap
# against a mandatory requirement, recorded in
# docs/plans/2026-09-05-ratchet-setup.md, not a decision that coverage is
# not needed. Adding a `coverage-org-node` Makefile target is what closes it.
# coverage_command:
#   - make coverage-org-node

expectation_age_days: 90
expectation_open_max: 10

# The dependency assessment is docs/plans/2026-09-06-dependency-edges.md.
# Both providers are class C, so the class floor (MISCLASSED-DEPENDENCY) has
# nothing to convict and no segregated_from: entry is needed. What org-node
# relies on that a provider does not state as a requirement is recorded as
# expects: items in this unit's SRS (REQ-q92yac on org-members). org-node
# reads no chain and names no on-chain-client path; org-io holds that edge.
depends_on:
  - org-members
  - person
# segregated_from:
#   - <unit> (RC-xxxxxx)
