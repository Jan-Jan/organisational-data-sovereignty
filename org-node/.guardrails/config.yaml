verify_commands:
  # 2026-10-07: three targets added by S3 (docs/plans/2026-10-06-org-io-commit-workflow.md).
  - cargo test -p org-node --features app,test-support --lib --test service_stories --test transport_handshake --test transport_networked --test fuzz_envelope_decode --test fuzz_verify_against_chain --test fuzz_first_admission_base --test fuzz_wire_decode --test verify_against_chain --test wire_frame_bound --test store_at_rest --test admission_sender --test value_types --test key_custody --test envelope_binding --test service_lifecycle --test encoding_golden --test node_value_types --test chain_read_state --test persona_records --test secret_redaction --test organisation_key --test receive_chain_reads --test expected_admission --test absences --test provisional_store --test commit_paths --test revocation --test reconcile --test commit_workflow_errors
  - quint --version
  - quint typecheck org-node/quint/protocol.qnt
  - quint typecheck org-node/quint/ods_instances.qnt
  - quint run org-node/quint/protocol.qnt --invariant=forkSafety --max-steps=16 --max-samples=5000
  - quint run org-node/quint/protocol.qnt --invariant=revocationSafety --max-steps=16 --max-samples=5000
  - quint run org-node/quint/protocol.qnt --invariant=revokedExcludedFromOrgSecret --max-steps=16 --max-samples=5000
  - quint run org-node/quint/protocol.qnt --invariant=tauWindow --max-steps=16 --max-samples=5000
  - quint run org-node/quint/protocol.qnt --invariant=convergence --max-steps=16 --max-samples=5000

