# No coverage_command: org-node's coverage has never been measured. Under
# class C statement AND decision coverage are required, so this is a gap
# against a mandatory requirement, recorded in
# docs/plans/2026-09-05-ratchet-setup.md, not a decision that coverage is
# not needed. Adding a `coverage-org-node` Makefile target is what closes it.
# coverage_command:
#   - make coverage-org-node

expectation_age_days: 90
expectation_open_max: 10

# Declared 2026-09-06 after the dependency assessment in
# docs/plans/2026-09-06-dependency-edges.md. Both providers are class C, so
# the class floor (MISCLASSED-DEPENDENCY) has nothing to convict and no
# segregated_from: entry is needed. What org-node relies on that neither
# provider states as a requirement is recorded as expects: items in this
# unit's SRS (REQ-ysyu9g on on-chain-client, REQ-q92yac on org-members).
depends_on:
  - org-members
  - on-chain-client
  - person
