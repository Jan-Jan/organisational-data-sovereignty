# guardrails configuration for the `org-node` unit — flat schema only:
#   `key: value` scalars and two-space `- item` lists, every key at column one,
#   set once, in its own form (LIST keys: strict_paths, test_paths,
#   verify_commands, coverage_command, depends_on, segregated_from; everything
#   else a scalar). The schema is CLOSED and validated before any gate runs;
#   the full rule list, with the reason each rule exists, is the header of
#   templates/config.yaml in the guardrails repository this was copied from.
#
# This is a UNIT config (.guardrails/units.yaml at the repository root names
# the units). Every doc_* value and every strict_paths/test_paths entry must
# sit inside this unit's own directory, and doc_verification must NOT be set —
# the verification record is repository-level (docs/verification).
#
# Scripts run from the repository root, so paths and commands below are
# repository-relative.
guardrails_version: 0.5.1
guardrails_commit: e2eac86ff8db2157735b9604b7ade190d4f465f3

# IEC 62304 software safety class. C: org-node holds the keys, makes the trust
# decisions, and does the chain and p2p I/O through which a member's access is
# granted or withdrawn. See docs/adr/2026-09-05-units-and-per-unit-classes.md.
safety_class: C

id_prefixes: REQ HAZ RC SDD LLR PR

# Canonical document locations. Ledgers populated 2026-09-09 by org-node's own
# risk analysis (tooth 3, docs/plans/2026-09-09-org-node-risk-analysis.md):
# six hazards and nine controls in doc_rmf, fifteen requirements in doc_srs,
# five open problem reports in doc_problems — one of them the chain-reader
# finality report, moved here from org-members' ledger (D14) with its
# `affects:` retargeted to an org-node control, because a consumer may not
# cite a provider's controls and a provider may not cite a consumer's items.
doc_srs: org-node/docs/requirements
doc_rmf: org-node/docs/risk
doc_sad: org-node/docs/architecture
doc_soup: org-node/docs/architecture/soup.md
doc_problems: org-node/docs/problems

# First time under trace discipline (this was tooth 7 of the 2026-08-26 plan).
# There are no item references in org-node yet, so this costs nothing today
# and stops new code being born untraced.
strict_paths:
  - org-node/src

test_paths:
  - org-node/tests

# The three chopsticks-dependent targets (chain_genesis_e2e, finality_polling,
# preflight) are excluded: they spawn a chopsticks fork and need
# on-chain/scripts/node_modules. The remaining targets are named explicitly so
# that a future chopsticks target added to the crate is not silently pulled
# in — and so the two fuzz targets cannot silently drop out.
# `--features app,test-support` is REQUIRED: the named targets carry
# `required-features` (app for service_stories, transport for
# transport_handshake, transport+test-support for transport_networked) and
# cargo refuses an explicit `--test` whose features are off. The first draft
# of this line omitted it and failed closed at the verification gate on
# 2026-09-05. `--lib` therefore compiles the library with `app` plus
# `test-support` — `app` is the configuration org-node ships in;
# `test-support` is never enabled in production builds (Cargo.toml) and exists
# only to expose gated test constructors, so the lib under test differs from
# the shipped lib by that feature alone.
# Measured 2026-09-05 (agent sandbox, CARGO_HOME=/tmp/cargo_home_fuzz), on
# the shorter line this comment then described: 38 passed, 0 failed.
# 2026-09-09: four targets added by org-node's risk analysis. Three hold unit
# tests relocated out of `src` into `tests/`, where `test_paths` reads their
# `verifies:` annotations, each from its own module: verify_against_chain from
# `verify.rs` and `sequence.rs`, wire_frame_bound from `transport/wire.rs`, and
# store_at_rest from `store.rs`. The fourth, admission_sender, is new: the
# sender cross-check tests, written against the service API.
# Measured 2026-09-10 (agent sandbox, CARGO_HOME=/tmp/cargo_home_fuzz) on the
# line below: 51 passed, 0 failed — lib 23, verify_against_chain 13,
# store_at_rest 4, wire_frame_bound 3, admission_sender 3, service_stories 3,
# transport_handshake 1, transport_networked 1. The two bolero targets report
# no pass count: each prints its iteration total and exits on its one-second
# budget.
# 2026-10-03, part 2 of docs/adr/2026-10-03-quint-conformance-gate.md: the
# protocol models moved into org-node/quint/, and their checks are
# unconditional entries here (decision 3) — both typechecks and the five
# simulator invariants, each with an explicit --max-steps (decision 7). Quint
# is not pinned; `quint --version` puts the version into every verification
# record (decision 7). The simulator runs use the default rust backend and
# need a writable ~/.quint (decision 9). Measured 2026-10-03 (agent sandbox,
# quint 0.33.0, rust backend): all five pass, about 1 s wall each, 5 s for
# the five together. These are checks of the system model only: org-node has
# no conformance test, so a Rust change to org-node is not checked against
# the model (decision 13's known gap).
# 2026-10-03, T2 of docs/plans/2026-10-03-random-member-id.md: a third bolero
# target, fuzz_first_admission_base (REQ-d9g6nt), asserts a first admission
# without a record snapshot is refused and fuzzes the snapshot decode.
verify_commands:
  - cargo test -p org-node --features app,test-support --lib --test service_stories --test transport_handshake --test transport_networked --test fuzz_envelope_decode --test fuzz_verify_against_chain --test verify_against_chain --test wire_frame_bound --test store_at_rest --test admission_sender --test fuzz_first_admission_base
  - quint --version
  - quint typecheck org-node/quint/protocol.qnt
  - quint typecheck org-node/quint/ods_instances.qnt
  - quint run org-node/quint/protocol.qnt --invariant=forkSafety --max-steps=16 --max-samples=5000
  - quint run org-node/quint/protocol.qnt --invariant=revocationSafety --max-steps=16 --max-samples=5000
  - quint run org-node/quint/protocol.qnt --invariant=revokedExcludedFromOrgSecret --max-steps=16 --max-samples=5000
  - quint run org-node/quint/protocol.qnt --invariant=tauWindow --max-steps=16 --max-samples=5000
  - quint run org-node/quint/protocol.qnt --invariant=convergence --max-steps=16 --max-samples=5000

problem_age_days: 30
problem_open_max: 10

# No coverage_command: org-node's coverage has never been measured. Under
# class C statement AND decision coverage are required, so this is a gap
# against a mandatory requirement, recorded in
# docs/plans/2026-09-05-ratchet-setup.md, not a decision that coverage is
# not needed. Adding a `coverage-org-node` Makefile target is what closes it.
# coverage_command:
#   - make coverage-org-node

expectation_age_days: 90
expectation_open_max: 10

# Declared 2026-09-06 after the dependency assessment in
# docs/plans/2026-09-06-dependency-edges.md. Both providers are class C, so
# the class floor (MISCLASSED-DEPENDENCY) has nothing to convict and no
# segregated_from: entry is needed. What org-node relies on that neither
# provider states as a requirement is recorded as expects: items in this
# unit's SRS (REQ-ysyu9g on on-chain-client, REQ-q92yac on org-members).
depends_on:
  - org-members
  - on-chain-client
# segregated_from:
#   - <unit> (RC-xxxxxx)
