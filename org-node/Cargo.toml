[package]
name = "org-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "ODS Phase 2 node logic: envelopes and verify-against-chain over the org-members trie"
publish = false

[features]
default = []
# On-chain reads via on-chain-client; org-node writes nothing to the chain.
# Pulls a large async stack; the Phase 2.1 core builds and tests without it.
chain = ["dep:subxt", "dep:tokio", "dep:on-chain-client", "dep:async-trait", "dep:hex"]
# Device-to-device transport over iroh QUIC (EndpointId = DevicePublicKey).
transport = ["dep:iroh", "dep:tokio"]
# Full node-app integration: chain + transport + encrypted persistence.
app = ["chain", "transport", "dep:chacha20poly1305", "dep:argon2"]
# Test-only seams (e.g. binding an iroh endpoint against an in-process relay).
# Never enabled in production builds; gated constructors live behind this.
# Pulls iroh's `test-utils` so `run_relay_server()` and the self-signed-relay
# `CaRootsConfig::insecure_skip_verify()` are available in any build that
# enables this feature (not just dev/test builds via the dev-dependency).
test-support = ["transport", "iroh/test-utils"]

[dependencies]
org-members = { path = "../org-members", default-features = false, features = ["std", "serde"] }
# The X25519 validity rule for the Organisation public key (REQ-8jb4ny):
# person::x25519::is_valid_public_key, the rule PersonPublicKey applies.
person = { path = "../person", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
# X25519 public keys for Member-as-a-group keys and the Organisation public key:
# MontgomeryPoint::mul_base_clamped (RFC 7748). Same 4.1.3 the lockfile
# already resolves through ed25519-dalek.
curve25519-dalek = "4"
# Wipes an X25519 secret (a member seed, an Organisation private key) when
# its `X25519Keypair` is dropped (LLR-98ufry). Same 1.9.0 the lockfile
# already resolves through ed25519-dalek's `zeroize` feature.
zeroize = "1.9"
postcard = { version = "1", features = ["alloc", "use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = { version = "2", default-features = false }
rand_core = "0.6"
# Features mirror on-chain-client's pins so the subxt types unify across crates.
subxt = { version = "0.50", default-features = false, features = ["native", "jsonrpsee", "reconnecting-rpc-client"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
on-chain-client = { path = "../on-chain-client", default-features = false, features = ["dev-rpc"], optional = true }
async-trait = { version = "0.1", optional = true }
hex = { version = "0.4", optional = true }
iroh = { version = "0.98", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }

[dev-dependencies]
rand = "0.8"
# Normal [dependencies] too, re-declared for the same reason org-members is
# below: an integration test crate cannot see the library's normal deps, and
# the relocated unit tests in tests/value_types.rs name them directly.
postcard = { version = "1", features = ["alloc", "use-std"] }
# The async tests need tokio's macros and timers whatever features are on.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# bolero 0.13 matches the version used in on-chain-client (the repo's other fuzz targets).
bolero = "0.13"
# Enables iroh::test_utils::run_relay_server() for the hermetic Networked test.
iroh = { version = "0.98", features = ["test-utils"] }
# org-members is also a normal [dependency], but integration test crates cannot
# see the library's normal deps directly — re-declared here so fuzz_verify_against_chain
# can name org_members::trie::OrgTrie, org_members::MemberLeaf, etc.
org-members = { path = "../org-members", features = ["std", "serde"] }
# Chopsticks test harness (tests/common, used by preflight): chopsticks spawn +
# subxt client. These mirror on-chain-client's dev-dependencies for the same
# helpers.
jsonrpsee = { version = "0.26", default-features = false, features = ["ws-client", "http-client"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
libc = "0.2"
async-trait = "0.1"
on-chain-client = { path = "../on-chain-client", default-features = false, features = ["dev-rpc"] }
subxt = { version = "0.50", default-features = false, features = ["native", "jsonrpsee"] }

[lints]
workspace = true

# The preflight binary is #![cfg(feature = "app")]; without this gate cargo
# would try to build it under feature sets lacking `app` (e.g. `--features
# transport`) and fail with E0601 (empty file, no `main`).
[[bin]]
name = "preflight"
required-features = ["app"]

[[test]]
name = "fuzz_envelope_decode"
path = "tests/fuzz_envelope_decode/fuzz_target.rs"
harness = false

[[test]]
name = "fuzz_verify_against_chain"
path = "tests/fuzz_verify_against_chain/fuzz_target.rs"
harness = false

# `first_admission_base` lives in `service`, which only exists under `app`.
[[test]]
name = "fuzz_first_admission_base"
path = "tests/fuzz_first_admission_base/fuzz_target.rs"
harness = false
required-features = ["app"]

[[test]]
name = "transport_handshake"
path = "tests/transport_handshake.rs"
required-features = ["transport"]

[[test]]
name = "service_stories"
path = "tests/service_stories.rs"
required-features = ["app"]

[[test]]
name = "preflight"
path = "tests/preflight.rs"
required-features = ["app"]

[[test]]
name = "transport_networked"
path = "tests/transport_networked.rs"
required-features = ["transport", "test-support"]

# The four targets below were added 2026-09-09 by org-node's risk analysis
# (docs/plans/2026-09-09-org-node-risk-analysis.md). They carry the
# `verifies:` annotations the traceability gate reads from `tests/`; the
# verify-path, frame and store cases were relocated here from `src` unit
# tests, the sender-check cases are new. `test-support` exposes
# `org_node::test_fixtures` to them.

[[test]]
name = "verify_against_chain"
path = "tests/verify_against_chain.rs"
required-features = ["test-support"]

[[test]]
name = "wire_frame_bound"
path = "tests/wire_frame_bound.rs"
required-features = ["transport", "test-support"]

[[test]]
name = "store_at_rest"
path = "tests/store_at_rest.rs"
required-features = ["app"]

[[test]]
name = "admission_sender"
path = "tests/admission_sender.rs"
required-features = ["app", "test-support"]

# Golden bytes pinned before the org-node type-safety refactor (LLR-ayrdr8).
# The store is `app`; `app` implies `transport` (wire).
[[test]]
name = "encoding_golden"
path = "tests/encoding_golden.rs"
required-features = ["app"]

# org-node's value types (SDD-swtd3w); uses the Display/Copy probe in
# `test_fixtures`, hence `test-support`. Written as `tests/value_types.rs` by
# the type-safety change; renamed `node_value_types` when master `05f6f04`
# brought a `value_types` target of its own (SDD-swtd3w) — both run.
[[test]]
name = "node_value_types"
path = "tests/node_value_types.rs"
required-features = ["test-support"]

# The chain read parses the Organisation state (LLR-mmdu38).
[[test]]
name = "chain_read_state"
path = "tests/chain_read_state.rs"
required-features = ["chain"]

# The Persona's records: parsed details and field-named refusal (SDD-af5vnt,
# SDD-vee2fq).
[[test]]
name = "persona_records"
path = "tests/persona_records.rs"
required-features = ["app", "test-support"]

# No secret reaches debug output (REQ-y7tsft, PR-hqwpg9).
[[test]]
name = "secret_redaction"
path = "tests/secret_redaction.rs"
required-features = ["app", "test-support"]
# The six targets below were added 2026-10-03 by org-node's architecture tooth
# (docs/plans/2026-10-03-org-node-architecture.md). Each holds unit tests
# relocated out of a `#[cfg(test)]` module in `src` into `tests/`, where
# `test_paths` reads their `verifies:` annotations — the same move this unit
# made on 2026-09-09 for the verify, store and frame cases. A low-level
# requirement whose only evidence sits in `src` cannot be traced, so an item
# would otherwise read as having no test at all.

[[test]]
name = "value_types"
path = "tests/value_types.rs"

[[test]]
name = "key_custody"
path = "tests/key_custody.rs"

[[test]]
name = "envelope_binding"
path = "tests/envelope_binding.rs"
required-features = ["test-support"]

[[test]]
name = "service_lifecycle"
path = "tests/service_lifecycle.rs"
required-features = ["app"]

# The Organisation public and private key: a fresh X25519 secret per created Organisation
# (REQ-ech45n) and the validity of the key read from the chain (REQ-8jb4ny).
[[test]]
name = "organisation_key"
path = "tests/organisation_key.rs"
required-features = ["app", "test-support"]

# The receive paths read the chain only after the chain-free checks
# (LLR-9ew26y), change worktree-org-node-chain-authority.
[[test]]
name = "receive_chain_reads"
path = "tests/receive_chain_reads.rs"
required-features = ["app", "test-support"]

# A first admission is read against the chain only when the app expects it
# under its invite identifier, and committed only when it lists one of this
# node's Personas (REQ-8amu2a, REQ-kt877x), change
# worktree-org-node-chain-authority.
[[test]]
name = "expected_admission"
path = "tests/expected_admission.rs"
required-features = ["app", "test-support"]

# What org-node must not contain after the chain-authority change
# (2026-10-06): reads org-node's own source and manifest.
[[test]]
name = "absences"
path = "tests/absences.rs"

# The provisional-update store: identity, persistence and the 1 MiB bound
# (2026-10-06, T8 of docs/plans/2026-10-05-chain-authority.md).
[[test]]
name = "provisional_store"
path = "tests/provisional_store.rs"
required-features = ["app", "test-support"]

# The node's own provisional updates and their commit: genesis built and kept,
# `commit_genesis` once the chain carries it (2026-10-06, T9 of
# docs/plans/2026-10-05-chain-authority.md).
[[test]]
name = "commit_paths"
path = "tests/commit_paths.rs"
required-features = ["app", "test-support"]
