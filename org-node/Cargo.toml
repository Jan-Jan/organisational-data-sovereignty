[package]
name = "org-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "ODS Phase 2 node logic: signing, envelopes, and verify-against-chain over the org-members trie"
publish = false

[features]
default = []
# On-chain reads (via on-chain-client) + writes (via subxt). Pulls a large
# async stack; the Phase 2.1 core builds and tests without it.
chain = ["dep:subxt", "dep:subxt-signer", "dep:tokio", "dep:on-chain-client", "dep:blake2", "dep:parity-scale-codec", "dep:async-trait", "dep:hex"]
# Device-to-device transport over iroh QUIC (NodeId = P2pDeviceKey).
transport = ["dep:iroh", "dep:tokio"]
# Full node-app integration: chain + transport + encrypted persistence + out-of-band blobs.
app = ["chain", "transport", "dep:chacha20poly1305", "dep:argon2", "dep:base64"]
# Test-only seams (e.g. binding an iroh endpoint against an in-process relay).
# Never enabled in production builds; gated constructors live behind this.
# Pulls iroh's `test-utils` so `run_relay_server()` and the self-signed-relay
# `CaRootsConfig::insecure_skip_verify()` are available in any build that
# enables this feature (not just dev/test builds via the dev-dependency).
test-support = ["transport", "iroh/test-utils"]

[dependencies]
org-members = { path = "../org-members", default-features = false, features = ["std", "serde"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
postcard = { version = "1", features = ["alloc", "use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = { version = "2", default-features = false }
rand_core = "0.6"
# Features mirror on-chain-client's pins so the subxt types unify across crates.
subxt = { version = "0.50", default-features = false, features = ["native", "jsonrpsee", "reconnecting-rpc-client"], optional = true }
subxt-signer = { version = "0.50", default-features = false, features = ["sr25519", "subxt"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
on-chain-client = { path = "../on-chain-client", default-features = false, features = ["dev-rpc"], optional = true }
blake2 = { version = "0.10", optional = true }
parity-scale-codec = { version = "3", default-features = false, features = ["derive"], optional = true }
async-trait = { version = "0.1", optional = true }
hex = { version = "0.4", optional = true }
iroh = { version = "0.98", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
rand = "0.8"
# The e2e test needs tokio's macros even when running `--features chain`.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# bolero 0.13 matches the version used in on-chain-client (the repo's other fuzz targets).
bolero = "0.13"
# Enables iroh::test_utils::run_relay_server() for the hermetic Networked test.
iroh = { version = "0.98", features = ["test-utils"] }
# org-members is also a normal [dependency], but integration test crates cannot
# see the library's normal deps directly — re-declared here so fuzz_verify_against_chain
# can name org_members::trie::OrgTrie, org_members::MemberLeaf, etc.
org-members = { path = "../org-members", features = ["std", "serde"] }
# Chain e2e test harness (chain_genesis_e2e): chopsticks spawn + subxt client.
# These mirror on-chain-client's dev-dependencies for the same helpers.
jsonrpsee = { version = "0.26", default-features = false, features = ["ws-client", "http-client"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
libc = "0.2"
hex = "0.4"
async-trait = "0.1"
subxt-signer = { version = "0.50", default-features = false, features = ["sr25519", "subxt"] }
on-chain-client = { path = "../on-chain-client", default-features = false, features = ["dev-rpc"] }
subxt = { version = "0.50", default-features = false, features = ["native", "jsonrpsee"] }

[lints]
workspace = true

# The preflight binary is #![cfg(feature = "app")]; without this gate cargo
# would try to build it under feature sets lacking `app` (e.g. `--features
# transport`) and fail with E0601 (empty file, no `main`).
[[bin]]
name = "preflight"
required-features = ["app"]

[[test]]
name = "fuzz_envelope_decode"
path = "tests/fuzz_envelope_decode/fuzz_target.rs"
harness = false

[[test]]
name = "fuzz_verify_against_chain"
path = "tests/fuzz_verify_against_chain/fuzz_target.rs"
harness = false

# `first_admission_base` lives in `service`, which only exists under `app`.
[[test]]
name = "fuzz_first_admission_base"
path = "tests/fuzz_first_admission_base/fuzz_target.rs"
harness = false
required-features = ["app"]

[[test]]
name = "chain_genesis_e2e"
path = "tests/chain_genesis_e2e.rs"
required-features = ["chain"]

[[test]]
name = "transport_handshake"
path = "tests/transport_handshake.rs"
required-features = ["transport"]

[[test]]
name = "service_stories"
path = "tests/service_stories.rs"
required-features = ["app"]

[[test]]
name = "preflight"
path = "tests/preflight.rs"
required-features = ["app"]

[[test]]
name = "transport_networked"
path = "tests/transport_networked.rs"
required-features = ["transport", "test-support"]

[[test]]
name = "finality_polling"
path = "tests/finality_polling.rs"
# FinalitySink is exported from the `app`-gated `service` module, so the test
# is #![cfg(feature = "app")]. Requiring `app` here keeps cargo from building
# it under bare `chain` (where it would compile to nothing and pass vacuously).
required-features = ["app"]

# The four targets below were added 2026-09-09 by org-node's risk analysis
# (docs/plans/2026-09-09-org-node-risk-analysis.md). They carry the
# `verifies:` annotations the traceability gate reads from `tests/`; the
# verify-path, frame and store cases were relocated here from `src` unit
# tests, the sender-check cases are new. `test-support` exposes
# `org_node::test_fixtures` to them.

[[test]]
name = "verify_against_chain"
path = "tests/verify_against_chain.rs"
required-features = ["test-support"]

[[test]]
name = "wire_frame_bound"
path = "tests/wire_frame_bound.rs"
required-features = ["transport", "test-support"]

[[test]]
name = "store_at_rest"
path = "tests/store_at_rest.rs"
required-features = ["app"]

[[test]]
name = "admission_sender"
path = "tests/admission_sender.rs"
required-features = ["app", "test-support"]
