[package]
name = "sparse-merkle-tree"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "One immutable sparse Merkle tree of a fixed depth, generic over its leaf and its hasher, with absence and inclusion proofs"

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
spin = { version = "0.9", default-features = false, features = ["once"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
blake3 = "1"
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"
proptest = "1"

[lints]
workspace = true
