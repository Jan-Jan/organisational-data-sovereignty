# guardrails configuration for the `sparse-merkle-tree` unit — flat schema only:
#   `key: value` scalars and two-space `- item` lists, every key at column one,
#   set once, in its own form (LIST keys: strict_paths, test_paths,
#   verify_commands, coverage_command, depends_on, segregated_from; everything
#   else a scalar). The schema is CLOSED and validated before any gate runs;
#   the full rule list, with the reason each rule exists, is the header of
#   templates/config.yaml in the guardrails repository this was copied from.
#
# This is a UNIT config (.guardrails/units.yaml at the repository root names
# the units). Every doc_* value and every strict_paths/test_paths entry must
# sit inside this unit's own directory. The verification record is
# repository-level: it is the change's signed squash commit message.
#
# Scripts run from the repository root, so paths and commands below are
# repository-relative.
guardrails_version: 0.5.1
guardrails_commit: d6e285e71a55a2de7ef342801923ca8ed71f9c76

# IEC 62304 software safety class. C: org-members and person (both class C)
# are to build the Membership record and the device root tree on this unit's one
# sparse Merkle tree, and a provider below its consumer's class is
# MISCLASSED-DEPENDENCY. A wrong root or an unsound absence proof would let a
# revoked DevicePublicKey or MemberId pass as held, or a held one as revoked —
# the pathway to serious injury docs/adr/2026-09-01-safety-class-c.md names.
# See docs/adr/2026-09-05-units-and-per-unit-classes.md.
safety_class: C

id_prefixes: REQ HAZ RC SDD LLR PR ADR

# Canonical document locations. Registered 2026-10-23 by the change that
# writes the unit's first requirements (worktree-generic-smt).
doc_srs: crates/sparse-merkle-tree/docs/requirements
doc_rmf: crates/sparse-merkle-tree/docs/risk
doc_sad: crates/sparse-merkle-tree/docs/architecture
doc_soup: crates/sparse-merkle-tree/docs/architecture/soup.md
doc_problems: crates/sparse-merkle-tree/docs/problems

# The crate's source (2026-10-24, plan T2).
strict_paths:
  - crates/sparse-merkle-tree/src

# The crate's integration tests.
test_paths:
  - crates/sparse-merkle-tree/tests

# The doctests of `cargo test` include LLR-ggu9bh's refusing side (a depth of
# 0 does not compile). `--no-default-features` builds the crate without serde.
verify_commands:
  - cargo test -p sparse-merkle-tree
  - cargo test -p sparse-merkle-tree --no-default-features
  - cargo clippy -p sparse-merkle-tree --all-targets -- -D warnings

# Statement and decision coverage, floors in the root Makefile (first set
# 2026-10-25, plan docs/plans/2026-10-24-sparse-merkle-tree.md, T11; ratchet
# upward only).
coverage_command:
  - make coverage-sparse-merkle-tree
  - make coverage-branch-sparse-merkle-tree

problem_age_days: 30
problem_open_max: 10

expectation_age_days: 90
expectation_open_max: 10

# sparse-merkle-tree depends on no unit: it is generic over its leaf and its
# hasher, and org-members and person depend on it, never the reverse.
# depends_on:
#   - <unit>
# segregated_from:
#   - <unit> (RC-xxxxxx)
